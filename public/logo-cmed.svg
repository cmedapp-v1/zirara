<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 131" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Tajawal:wght@700;800;900&amp;family=Noto+Sans+Tifinagh&amp;display=swap');
      .cmed-ar { font-family: 'Tajawal', 'Amiri', 'Arial', sans-serif; font-weight: 800; fill: #111827; }
      .cmed-tf { font-family: 'Noto Sans Tifinagh', 'Segoe UI Historic', sans-serif; font-weight: 700; fill: #111827; letter-spacing: 1px; }
      .cmed-fr { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 600; fill: #1e293b; letter-spacing: -0.2px; }
    </style>
  </defs>

  <!-- Left: Tifinagh Text -->
  <g class="cmed-tf" text-anchor="middle">
    <text x="85" y="44" font-size="22">ⵜ.ⴼ.ⵍ.ⵍ. ⵜ.ⵎⵖⵔ.ⴱⵉⵜ</text>
    <text x="85" y="80" font-size="22">ⵍ:ⵜⵔⴱⵢⵜ ⴷ:ⵓⵜⵏⵎⵉⵜ</text>
  </g>

  <!-- Center: CMED Emblem -->
  <g id="cmed-emblem">
    <!-- Red Head / Dot -->
    <ellipse cx="204" cy="22" rx="10.5" ry="7.5" fill="#D93829" />

    <!-- Blue Swoosh (Left curve) -->
    <path d="M 180 72 C 160 55 162 34 182 25 C 196 19 204 22 201 26 C 187 31 176 43 182 62 C 185 70 190 74 195 78 C 189 77 184 75 180 72 Z" fill="#1D70B8" />

    <!-- Green Swoosh (Bottom inner curve) -->
    <path d="M 172 73 C 185 75 204 74 218 63 C 228 55 233 46 236 40 C 235 43 230 52 220 60 C 208 70 190 73 172 73 Z" fill="#15803D" />

    <!-- Orange / Yellow Swoosh (Right dynamic curve) -->
    <path d="M 218 36 C 232 40 248 53 248 69 C 248 83 238 96 216 102 C 227 96 235 88 238 78 C 242 66 236 50 221 41 C 218 39 216 38 214 36 C 215 36 216 36 218 36 Z" fill="#E58E1A" />
  </g>

  <!-- Right: Arabic Text -->
  <g class="cmed-ar" text-anchor="end" dir="rtl">
    <text x="430" y="42" font-size="26">الهيئة المغربية</text>
    <text x="430" y="78" font-size="26">للتربية والتنمية</text>
  </g>

  <!-- Bottom: French Text -->
  <text x="220" y="114" class="cmed-fr" text-anchor="middle" font-size="16">
    Corps Marocain pour Éducation et Développement
  </text>
</svg>
